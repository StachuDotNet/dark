# One site, as `deploy/site/build-image` reads it. Shell syntax; sourced at every start.

# The router `serve` runs. It answers every host this app is the address for.
ROUTER=Example.Sites.router

# Each DB the site's code names, as Name=Type. A DB declaration is not part of the code (it does not
# sync and is not in any commit), so this is where it lives; every start creates the ones missing.
DBS="ExampleSitesNotes=Example.Sites.Note"

# Grants beyond what a fresh store allows (package store, stdio, clock, randomness, its own DBs),
# one `dark permissions allow` rule per line. The port is granted for you.
ALLOW=""
